# source-refresh: 64e00aaf
name: Package Source Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22.16.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Assert portable build helper works without lifecycle scripts
        run: node --input-type=module -e "import('esbuild').then((m) => { if (!m.transformSync('const x = 1').code.includes('const x')) process.exit(1); })"

      - name: Capture portable Node runtime
        shell: bash
        run: |
          mkdir -p .portable-node
          cp "$(command -v node)" .portable-node/node
          .portable-node/node --version

      - name: Write exact-source provenance
        shell: bash
        run: |
          lock_sha="$(sha256sum package-lock.json | awk '{print $1}')"
          cat > .portable-provenance.json <<EOF
          {
            "schemaVersion": 1,
            "repository": "${GITHUB_REPOSITORY}",
            "branch": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "node": "$(node --version)",
            "npm": "$(npm --version)",
            "installMode": "npm ci --ignore-scripts --no-audit --no-fund",
            "proofLevel": "PACKAGED_SOURCE_ONLY_NOT_INTEGRATED_RUNTIME_ACCEPTANCE",
            "packageLockSha256": "${lock_sha}"
          }
          EOF
          cat .portable-provenance.json

      - name: Upload portable workspace
        uses: actions/upload-artifact@v7
        with:
          name: lazy-developer-portable
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 7
