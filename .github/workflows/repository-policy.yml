name: Repository Policy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node 22.16.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0

      - name: Verify repository policy
        run: node tooling/repository/verify.mjs
