name: Verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22.16.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Repository policy
        run: npm run verify:repository

      - name: Source hygiene audit
        run: npm run audit:source

      - name: Public API audit
        run: npm run audit:api

      - name: Typecheck
        run: npm run typecheck

      - name: Bug Report UI build
        run: npm run bug-report-ui:build

      - name: Test
        run: npm test
